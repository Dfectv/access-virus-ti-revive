# Build TI Revive: the plug-in "TI Revive Virus Control" (native/) on Windows (MSVC, + ASIO driver), macOS (VST3 + AU,
# universal) and Linux (Ubuntu 22.04); the Windows broker cross-compiled with mingw-w64 and the MSI with WiX 5; the
# macOS zip (scripts/mac-build-release.sh) and the Linux tarball (scripts/linux-build-release.sh).
# Runs when a version tag v<major>.<minor>.<build> (e.g. v0.2.3) is pushed: builds everything and creates a GitHub
# Release; the version is taken from the tag. No builds on branch pushes or pull requests. By hand, to check the
# packages of a branch before a tag: gh workflow run build --ref <branch> -f version=0.0.1 - builds and uploads the
# packages as artifacts only (the release job needs a tag).
name: build

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: test version for the packages (numeric, e.g. 0.0.1)
        default: 0.0.1

env:
  VERSION: ${{ inputs.version }} # empty on a tag push: the jobs take the tag

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@v7
      - name: Install mingw-w64 and libusb (Linux probe)
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends gcc-mingw-w64-x86-64 libusb-1.0-0-dev pkg-config make
      - name: Build # the broker for the MSI (0.8: the classic wrapper and the research tools are not shipped)
        run: make -C src/broker
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: work/build/vtibroker.exe
          if-no-files-found: error

  native-windows: # the native plug-in "TI Revive Virus Control" + ASIO driver "TI Revive Virus Audio" (native/, MSVC)
    runs-on: windows-2022
    timeout-minutes: 25 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -S native -B native-build -G "Visual Studio 17 2022" -A x64
          cmake --build native-build --config Release --target VirusTINative VirusTINative_ASIO tirevive-cc TIReviveControlCenter vtitests
      - name: Unit tests
        run: ctest --test-dir native-build -C Release --output-on-failure
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory nativebin | Out-Null
          Copy-Item -Recurse "native-build\VST3\Release\TI Revive Virus Control.vst3" nativebin\
          Remove-Item "nativebin\TI Revive Virus Control.vst3\Contents\x86_64-win\*.map" -ErrorAction SilentlyContinue
          Copy-Item native-build\bin\Release\VirusTINative_ASIO.dll nativebin\
          Copy-Item native-build\bin\Release\tirevive-cc.exe nativebin\
          Copy-Item native-build\ccapp\TIReviveControlCenter.exe nativebin\
      - uses: actions/upload-artifact@v7
        with:
          name: nativebin
          path: nativebin
          if-no-files-found: error

  msi:
    needs: [binaries, native-windows]
    runs-on: windows-2022
    timeout-minutes: 20 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: bin
      - uses: actions/download-artifact@v8
        with:
          name: nativebin
          path: nativebin
      - name: Version
        id: ver
        shell: pwsh
        run: |
          # tag v1.2.3 -> 1.2.3 (MSI versions must be numeric)
          if ($env:VERSION -match '^\d+\.\d+\.\d+$') { $v = $env:VERSION }
          elseif ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') { $v = $Matches[1] } else { throw "not a version tag: $env:GITHUB_REF" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "MSI version $v"
      - name: Install WiX 5
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
      - name: Build MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          ./src/installer/build.ps1 -Bin "$PWD\bin" -Src "$PWD\src" -Out "$PWD\out" -Version "${{ steps.ver.outputs.version }}" -Bundle -NativeBin "$PWD\nativebin"
      - name: Rename
        shell: pwsh
        run: |
          Rename-Item "out\TI Revive.msi" "TI-Revive-${{ steps.ver.outputs.version }}.msi"
          Rename-Item "out\TI Revive setup.exe" "TI-Revive-${{ steps.ver.outputs.version }}-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: TI-Revive-msi
          path: |
            out/TI-Revive-*.msi
            out/TI-Revive-*-setup.exe
          if-no-files-found: error

  mac:
    runs-on: macos-15
    timeout-minutes: 25 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo
          submodules: recursive # native/external/vst3sdk
      - name: Build
        run: |
          v="${VERSION:-${GITHUB_REF_NAME#v}}"
          bash repo/scripts/mac-build-release.sh repo "$v" "$PWD/out"
      - uses: actions/upload-artifact@v7
        with:
          name: TI-Revive-mac
          path: out/TI-Revive-*-mac.zip
          if-no-files-found: error

  native-linux: # the native plug-in for Linux, on Ubuntu 22.04 (glibc 2.35: runs on Ubuntu 22.04 / Debian 12 and newer)
    runs-on: ubuntu-22.04
    timeout-minutes: 25 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # native/external/vst3sdk
      - name: Build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends g++ make ninja-build libx11-dev \
            libxcb1-dev libxcb-util-dev libxcb-cursor-dev libxcb-xkb-dev libxcb-keysyms1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libfontconfig1-dev libcairo2-dev libgtkmm-3.0-dev libsqlite3-dev libpango1.0-dev
          pip3 install --user "cmake>=3.25" # Ubuntu 22.04 ships 3.22
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          cmake -S native -B native-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native-build --target VirusTINative tirevive-cc TIReviveControlCenter vtitests
          strip "native-build/VST3/Release/TI Revive Virus Control.vst3/Contents/x86_64-linux/TI Revive Virus Control.so"
          mkdir native-linux && cp -R "native-build/VST3/Release/TI Revive Virus Control.vst3" native-linux/
          install -m 0755 -s native-build/bin/Release/tirevive-cc native-linux/
          install -m 0755 -s native-build/ccapp/TIReviveControlCenter native-linux/
      - name: Unit tests
        run: ctest --test-dir native-build --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux
          path: native-linux
          if-no-files-found: error

  linux:
    needs: native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-linux
          path: native-linux
      - name: Install build tools
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends make curl bzip2
      - name: Build
        run: NATIVE_PREBUILT="$PWD/native-linux/TI Revive Virus Control.vst3" NATIVE_CC="$PWD/native-linux/tirevive-cc" NATIVE_CCAPP="$PWD/native-linux/TIReviveControlCenter" bash scripts/linux-build-release.sh "$PWD" "${VERSION:-${GITHUB_REF_NAME#v}}" "$PWD/out"
      - uses: actions/upload-artifact@v7
        with:
          name: TI-Revive-linux
          path: out/TI-Revive-*-linux.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [msi, mac, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TI-Revive-msi
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: TI-Revive-mac
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: TI-Revive-linux
          path: out
      - uses: actions/checkout@v7
        with:
          path: repo
          sparse-checkout: scripts/tirevive-usbinfo.ps1
          sparse-checkout-cone-mode: false
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF_NOTES
          **TI Revive $v** - Total Integration for the Access Virus TI without the old Access drivers, now with the
          native plug-in **"TI Revive Virus Control"**: looks and works like the original Virus Control and runs
          natively on Windows, macOS (Apple Silicon and Intel) and Linux - no Rosetta, Wine or yabridge.

          **New in 0.8.17: audio from your DAW through the Virus, and a help mode.** Set PATCH UTILITY > Preferences >
          "Input and Output Configuration" to "3 Outs / 1 Input" and a part's Input Mode (FX 1 page) to Static or
          Dynamic: the plug-in's sidechain input then goes into the Virus and through that part's filters and effects,
          as in the original. REAPER: a 4-channel Virus track, the audio sent to channels 3/4. Ableton Live: pick the
          track in the device's Sidechain section. Tested on Linux (REAPER) and macOS (Ableton Live 12), not yet on a
          real Windows PC. Known issue: after reopening a project set Input Mode once more. And the ? button at the
          bottom right now explains every control: point at a control to read its note, Esc to leave. The Audio Unit
          was tested in Logic Pro for the first time.

          **Since 0.8.12: sharper editor on large screens.** At 150 or 200 % (right-click the editor, or your
          display scaling) the plug-in's images are now computed sharper from your own Access files instead of
          being stretched. Linux: reopening the editor no longer crashes the DAW (since 0.8.0), and the menus open
          where you click at 150 and 200 %.

          **Since 0.8.10: steadier connection.** Switch the Virus off and on (or replug it) while your DAW runs:
          the plug-in now waits until it is ready and plays in time again. Start your DAW before the Virus is on: the
          plug-in sends its start-up and your project's sounds as soon as the Virus is there (before they were lost).
          Windows: two DAWs no longer use the Virus at the same time - the second one shows "Virus unavailable" and
          takes over when the first one closes. USB 3 now also works in "3 Outs / 1 Input".

          **Since 0.8.9: the third USB output.** Like the original Virus Control, you can now use USB 3: in the
          plug-in open PATCH UTILITY > Preferences and set "Input and Output Configuration" to "3 Outs / No Input".
          Then a part's output can be "USB3 L+R" and its sound comes out of the plug-in's Out 3 - for example for
          bass, lead and pad on three separate mixer channels in your DAW. The setting is kept for this computer.
          Thanks for asking (issue #4)!

          **Since 0.8.8: soft knobs on the Virus change the sound.** Turning the three soft knobs on the Virus itself
          now changes the sound (0.8.7 only moved them in the editor). After a preset chosen on the Virus is loaded,
          your current mod wheel, breath, expression and other controller positions are sent again, like the
          original Virus Control does.

          **Since 0.8.7: presets and soft knobs on the Virus itself.** A preset you choose on the Virus (its
          display, knobs or buttons) now loads into the plug-in and sounds - before, the part kept its old sound and
          the plug-in stayed on the old patch. The three soft knobs work in both directions now: in the editor they
          control the parameter their destination selects (Easy page), and when you turn them on the Virus the
          plug-in follows. Thanks for the reports (issue #4)!

          **Since 0.8.6: steadier start-up.** The plug-in now waits until the Virus has really worked through its
          start-up messages and your project's sound, instead of a fixed 4 seconds: the first notes play in time,
          also when a duplicated track takes over the Virus (before, the first notes after the takeover could be
          up to 2 s late).

          **Since 0.8.5: one plug-in instance per Virus, also on Windows.** Duplicating a track with the plug-in
          (e.g. in Ableton) no longer puts the Virus out of time: the copy shows "Virus unavailable" like the original
          Virus Control, and when you delete the first instance, the copy takes over the Virus and plays in time
          after a short start-up. Thanks for the report (issue #6)!

          **Since 0.8.4: bigger editor.** Right-click an empty spot of the plug-in's editor and choose a size from
          100 to 200 %; the choice is kept for new editors. The plug-in also follows the display scaling Windows
          reports (e.g. 150 %). The Control Center has the same sizes under View > Size. Thanks for the suggestion!

          **Since 0.8.3:** a DAW's plug-in scan no longer talks to the Virus (it connects only when the plug-in is
          used); saved projects no longer grow by a few bytes on every save; on a first setup the start page shows how
          long reading the Virus' banks will take (8-9 minutes once, then seconds). Thanks to the virus-ti-rework
          project for the findings.

          **Since 0.8.2: TI Revive Control Center** - in the look of Access' Virus Control Center (taken from your
          Access installer, like the plug-in's skin): device info, backup of the RAM banks as patch libraries, library
          conversion (.mid / .syx), and a **Nerd mode** that shows live what goes between TI Revive and the Virus
          (decoded, read-only) plus the logs for bug reports. Also as the command line tool \`tirevive-cc\`. Firmware /
          OS updates and flash functions are not supported, on purpose. Linux: the app needs gtkmm 3. Clean-ups: the
          Linux broker no longer opens a TCP port; the macOS broker no longer runs the MIDI stand-in of the old
          Access plug-in.

          **Windows 10/11 x64:** download \`TI-Revive-$v-setup.exe\` (or the same installer as \`TI-Revive-$v.msi\`)
          and put your own Access "Virus TI Software Suite" 64-bit \`.msi\` next to it. Run it (not code-signed:
          SmartScreen -> More info -> Run anyway) and keep "Set up the Access Virus TI files now" checked: the Access
          .msi is only unpacked, not installed. Sound card: ASIO device **"TI Revive Virus Audio"**.

          **macOS 14.4+ (Apple Silicon and Intel):** download \`TI-Revive-$v-mac.zip\`, run \`TI Revive.pkg\` (not
          signed: right-click > Open), then \`Set up Access Virus TI files.command\` with your own Access \`.pkg\` next
          to it (only unpacked). VST3 and Audio Unit (Logic, GarageBand), no Rosetta. Allow your DAW to use the
          microphone. Details: README-mac.txt.

          **Linux (x86_64, Ubuntu 22.04 / Debian 12+):** download \`TI-Revive-$v-linux.tar.gz\`, unpack it and run
          \`./install.sh\` with your Access \`.msi\` (unpacked with msitools or Wine). Details: README-linux.txt.

          **Coming from 0.7.x:** the classic plug-in "Virus TI (TI Revive)" is replaced; its projects open with
          "TI Revive Virus Control". **Virus TI Snow owners: please stay with 0.7.4 for now** - the Snow is not
          supported by 0.8.x yet (testers welcome).

          Not affiliated with Access Music or Kemper. Contains no Access software. See the
          [README](https://github.com/$GITHUB_REPOSITORY#readme) for how it works, limitations and uninstall.
          EOF_NOTES
          gh release create "$GITHUB_REF_NAME" out/TI-Revive-*-setup.exe out/TI-Revive-*.msi out/TI-Revive-*-mac.zip \
            out/TI-Revive-*-linux.tar.gz repo/scripts/tirevive-usbinfo.ps1 \
            --repo "$GITHUB_REPOSITORY" --title "TI Revive $v" --notes-file notes.md
