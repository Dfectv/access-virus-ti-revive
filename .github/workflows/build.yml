# Build TI Revive: cross-compile the Windows binaries on Linux (mingw-w64), build the MSI with WiX 5 on Windows,
# build the macOS zip (native bridge + Rosetta helper, scripts/mac-build-release.sh) on an Apple Silicon runner,
# build the Linux tarball (scripts/linux-build-release.sh).
# Runs ONLY when a version tag v<major>.<minor>.<build> (e.g. v0.2.3) is pushed: no builds on branch pushes, pull
# requests or by hand. Each run uploads "TI-Revive-msi" as an artifact and creates a GitHub Release with the MSI
# attached; the MSI version is taken from the tag.
name: build

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install mingw-w64 and libusb (Linux probe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 libusb-1.0-0-dev pkg-config make
      - name: Build
        run: |
          make -C src/broker
          make -C src/wrapper
          make -C src/vtihook
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            work/build/vtibroker.exe
            work/build/vtilaunch.exe
            work/build/vtiemu-pipe.dll
            work/build/TIRevive_ASIO.dll
            work/build/VirusTI_WinUSB.vst3
            work/build/vtiprobe.exe
            work/build/vtiprobe-pipe.exe
            work/build/vtisend.exe
            work/build/vtiflash.exe
            work/build/vtihook.dll
            work/build/vtiinject.exe
          if-no-files-found: error

  native-windows: # the native plug-in "TI Revive Virus Control" + ASIO driver "TI Revive Virus Audio" (native/, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -S native -B native-build -G "Visual Studio 17 2022" -A x64
          cmake --build native-build --config Release --target VirusTINative VirusTINative_ASIO vtitests
      - name: Unit tests
        run: ctest --test-dir native-build -C Release --output-on-failure
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory nativebin | Out-Null
          Copy-Item -Recurse "native-build\VST3\Release\TI Revive Virus Control.vst3" nativebin\
          Remove-Item "nativebin\TI Revive Virus Control.vst3\Contents\x86_64-win\*.map" -ErrorAction SilentlyContinue
          Copy-Item native-build\bin\Release\VirusTINative_ASIO.dll nativebin\
      - uses: actions/upload-artifact@v7
        with:
          name: nativebin
          path: nativebin
          if-no-files-found: error

  msi:
    needs: [binaries, native-windows]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: bin
      - uses: actions/download-artifact@v8
        with:
          name: nativebin
          path: nativebin
      - name: Version
        id: ver
        shell: pwsh
        run: |
          # tag v1.2.3 -> 1.2.3 (MSI versions must be numeric)
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') { $v = $Matches[1] } else { throw "not a version tag: $env:GITHUB_REF" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "MSI version $v"
      - name: Install WiX 5
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
      - name: Build MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          ./src/installer/build.ps1 -Bin "$PWD\bin" -Src "$PWD\src" -Out "$PWD\out" -Version "${{ steps.ver.outputs.version }}" -Bundle -NativeBin "$PWD\nativebin"
      - name: Rename
        shell: pwsh
        run: |
          Rename-Item "out\TI Revive.msi" "TI-Revive-${{ steps.ver.outputs.version }}.msi"
          Rename-Item "out\TI Revive setup.exe" "TI-Revive-${{ steps.ver.outputs.version }}-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: TI-Revive-msi
          path: |
            out/TI-Revive-*.msi
            out/TI-Revive-*-setup.exe
          if-no-files-found: error

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo
          submodules: recursive # native/external/vst3sdk
      - name: VST3 pluginterfaces (MIT, pinned)
        run: |
          git clone -q https://github.com/steinbergmedia/vst3_pluginterfaces.git vst3sdk/pluginterfaces
          git -C vst3sdk/pluginterfaces checkout -q 4f547e8e102b47de4a8b8aaf343c73b700786372
      - name: Build
        run: |
          v="${GITHUB_REF_NAME#v}"
          VST3SDK="$PWD/vst3sdk" bash repo/scripts/mac-build-release.sh repo "$v" "$PWD/out"
      - uses: actions/upload-artifact@v7
        with:
          name: TI-Revive-mac
          path: out/TI-Revive-*-mac.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04 # glibc 2.35: the native plug-in runs on Ubuntu 22.04 / Debian 12 and newer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # native/external/vst3sdk
      - name: Install mingw-w64 and the native plug-in's build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 make curl bzip2 \
            g++ ninja-build libx11-dev libxcb1-dev libxcb-util-dev libxcb-cursor-dev libxcb-xkb-dev libxcb-keysyms1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libcairo2-dev libgtkmm-3.0-dev libsqlite3-dev \
            libpango1.0-dev
          pip3 install --user "cmake>=3.25" # Ubuntu 22.04 ships 3.22
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: bash scripts/linux-build-release.sh "$PWD" "${GITHUB_REF_NAME#v}" "$PWD/out"
      - uses: actions/upload-artifact@v7
        with:
          name: TI-Revive-linux
          path: out/TI-Revive-*-linux.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [msi, mac, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TI-Revive-msi
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: TI-Revive-mac
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: TI-Revive-linux
          path: out
      - uses: actions/checkout@v7
        with:
          path: repo
          sparse-checkout: scripts/tirevive-usbinfo.ps1
          sparse-checkout-cone-mode: false
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF_NOTES
          **TI Revive $v** - Total Integration for the Access Virus TI without the old Access drivers.

          **Windows 10/11 x64:** download \`TI-Revive-$v-setup.exe\` (or the same installer as \`TI-Revive-$v.msi\`)
          and put your own Access "Virus TI Software Suite" 64-bit \`.msi\` next to it. Run it (not code-signed:
          SmartScreen -> More info -> Run anyway) and keep "Install the Access Virus TI software now" checked on the
          last page.

          **macOS on Apple Silicon (14.4+):** download \`TI-Revive-$v-mac.zip\`, run \`TI Revive.pkg\`
          (not signed: right-click > Open), then \`Install Access Virus TI software.command\` with your own
          Access \`.pkg\` next to it. Your DAW runs natively; allow it to use the microphone. Details: README-mac.txt.

          **Linux (x86_64):** download \`TI-Revive-$v-linux.tar.gz\`, unpack it and run \`./install.sh\` (details:
          README-linux.txt).

          In your DAW use the plug-in **"Virus TI (TI Revive)"** - or the new native plug-in **"TI Revive Virus
          Control"** (VST3 on Windows, macOS and Linux; runs without Rosetta, Wine or yabridge). On Windows the
          Virus is also a sound card: ASIO device **"TI Revive Virus Audio"**. Virus TI Snow: use "Virus TI (TI
          Revive)" for now.

          Not affiliated with Access Music or Kemper. Contains no Access software. See the
          [README](https://github.com/$GITHUB_REPOSITORY#readme) for how it works, limitations and uninstall.
          EOF_NOTES
          gh release create "$GITHUB_REF_NAME" out/TI-Revive-*-setup.exe out/TI-Revive-*.msi out/TI-Revive-*-mac.zip \
            out/TI-Revive-*-linux.tar.gz repo/scripts/tirevive-usbinfo.ps1 \
            --repo "$GITHUB_REPOSITORY" --title "TI Revive $v" --notes-file notes.md
