# Build TI Revive: cross-compile the Windows binaries on Linux (mingw-w64), build the MSI with WiX 5 on Windows.
# Every run uploads "TI-Revive-msi" as a downloadable artifact. Pushing a tag v<major>.<minor>.<build> (e.g. v0.1.2)
# additionally creates a GitHub Release with the MSI attached; the MSI version is taken from the tag.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64 and libusb (Linux probe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 libusb-1.0-0-dev pkg-config make
      - name: Build
        run: |
          make -C src/broker
          make -C src/wrapper
          make -C src/vtihook
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            work/build/vtibroker.exe
            work/build/vtilaunch.exe
            work/build/vtiemu-pipe.dll
            work/build/VirusTI_WinUSB.vst3
            work/build/vtiprobe.exe
            work/build/vtiprobe-pipe.exe
            work/build/vtisend.exe
            work/build/vtiflash.exe
            work/build/vtihook.dll
            work/build/vtiinject.exe
          if-no-files-found: error

  msi:
    needs: binaries
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin
      - name: Version
        id: ver
        shell: pwsh
        run: |
          # tag v1.2.3 -> 1.2.3; other builds: 0.1.<run number> (MSI versions must be numeric)
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') { $v = $Matches[1] } else { $v = "0.1.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "MSI version $v"
      - name: Install WiX 5
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          ./src/installer/build.ps1 -Bin "$PWD\bin" -Src "$PWD\src" -Out "$PWD\out" -Version "${{ steps.ver.outputs.version }}"
      - name: Rename
        shell: pwsh
        run: Rename-Item "out\TI Revive.msi" "TI-Revive-${{ steps.ver.outputs.version }}.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: TI-Revive-msi
          path: out/TI-Revive-*.msi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: msi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TI-Revive-msi
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/TI-Revive-*.msi \
            --repo "$GITHUB_REPOSITORY" --title "TI Revive ${GITHUB_REF_NAME#v}" \
            --notes "Installer for Windows 10/11 x64. Requires your own Access \"Virus TI Software Suite\" 64-bit MSI next to it (see README)."
